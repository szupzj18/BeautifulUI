name: Catalog
options:
  bundleIdPrefix: com.chrispan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  BeautifulUI:
    path: ../BeautifulUI
targets:
  Catalog:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BeautifulUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispan.BeautifulUICatalog
        PRODUCT_NAME: BeautifulUI Catalog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeautifulUI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
