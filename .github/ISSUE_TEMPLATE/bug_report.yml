name: Bug report
description: Something looks or behaves differently from what you expect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If it is a security problem, please do not
        file it here; follow [SECURITY.md](https://github.com/szupzj18/BeautifulUI/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Loading State
        - Thinking
        - Streaming Text
        - Approval Card
        - Tool Chips
        - Task Rows
        - Chat
        - Prompt Bar
        - Recommendation Card
        - Context Cards
        - Diff Table
        - Records Table
        - Filter Table
        - Sidebar Nav
        - Search
        - Flowchart
        - Insight Cards
        - Code Block
        - Fine-tune Card
        - Selection Actions
        - Agent Screen
        - Theme / tokens
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot or screen recording helps. If it differs from beautifului.dev, say how.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest SwiftUI snippet that shows it is best.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BeautifulUI version
      description: A tag, or the commit you depend on.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: iOS or macOS version, device or simulator, Xcode and Swift version.
      placeholder: iOS 26.0, iPhone 17 Pro simulator, Xcode 26.0, Swift 6.2
    validations:
      required: true
